<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Consistency</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root { --bg: #f7f7f5; --ink: #111; --dim: #a3a3a0; --dot: #e4e4e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0b; --ink: #ededed; --dim: #555; --dot: #1f1f1f; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); min-height: 100%; }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
    padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  main { width: 100%; max-width: 520px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px; }
  #title { font-size: 14px; color: var(--dim); outline: none; cursor: text; }
  #streak { font-size: 56px; font-weight: 200; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  #streak small { font-size: 14px; font-weight: 400; color: var(--dim); letter-spacing: 0; margin-left: 6px; }

  #dots { display: grid; grid-template-columns: repeat(auto-fill, 12px); gap: 10px; justify-content: space-between; }
  #dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--dot); cursor: pointer;
            transition: background .3s ease, transform .3s ease; }
  #dots i.on { background: var(--ink); }
  #dots i.future { opacity: .45; cursor: default; }
  #dots i.today:not(.on) { box-shadow: 0 0 0 1.5px var(--ink) inset; background: transparent; animation: breathe 2.4s ease-in-out infinite; }
  #dots i.pop { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes breathe { 50% { opacity: .35; } }
  @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }

  footer { display: flex; justify-content: space-between; margin-top: 40px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #year { cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <span id="title" spellcheck="false">consistency</span>
    <span id="streak">0<small>days</small></span>
  </header>
  <div id="dots"></div>
  <footer>
    <span id="year"></span>
    <span id="count"></span>
  </footer>
</main>

<script>
(() => {
  const KEY = 'consistency.v1';
  const $ = id => document.getElementById(id);

  let state = { title: 'consistency', days: [] };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
  const days = new Set(state.days);
  const save = () => {
    state.days = [...days].sort();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  };

  const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const today = () => addDays(new Date(), 0);

  const run = d => { let n = 0; while (days.has(key(d))) { n++; d = addDays(d, -1); } return n; };
  // Today stays "pending" until midnight, so an unmarked morning doesn't read as a broken streak.
  const streak = () => { const t = today(); return days.has(key(t)) ? run(t) : run(addDays(t, -1)); };

  let year = today().getFullYear();

  function render(popKey) {
    const t = today(), tk = key(t);
    const n = streak();
    $('streak').firstChild.textContent = n;
    $('streak').lastChild.textContent = n === 1 ? 'day' : 'days';

    const frag = document.createDocumentFragment();
    let done = 0, elapsed = 0;
    for (let d = new Date(year, 0, 1); d.getFullYear() === year; d = addDays(d, 1)) {
      const k = key(d), el = document.createElement('i');
      el.dataset.k = k;
      el.title = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      if (d > t) el.className = 'future';
      else {
        elapsed++;
        if (days.has(k)) { el.classList.add('on'); done++; }
        if (k === tk) el.classList.add('today');
        if (k === popKey) el.classList.add('pop');
      }
      frag.appendChild(el);
    }
    $('dots').replaceChildren(frag);
    $('year').textContent = year;
    $('count').textContent = `${done} / ${elapsed}`;
  }

  function toggle(k) {
    days.has(k) ? days.delete(k) : days.add(k);
    save();
    render(days.has(k) ? k : null);
    if (days.has(k) && navigator.vibrate) navigator.vibrate(10);
  }
  const markToday = () => {
    const k = key(today());
    year = today().getFullYear();
    days.has(k) ? render() : toggle(k);
  };

  // Tap a dot to toggle that day. Tap anywhere else to mark today (never unmarks).
  document.addEventListener('click', e => {
    if (e.target.closest('#title, #year')) return;
    const k = e.target.dataset && e.target.dataset.k;
    if (k) { if (!e.target.classList.contains('future')) toggle(k); return; }
    markToday();
  });

  const years = () => [...new Set([...days].map(k => +k.slice(0, 4)).concat(today().getFullYear()))].sort();
  const shiftYear = dir => { const ys = years(), i = ys.indexOf(year); year = ys[(i + dir + ys.length) % ys.length]; render(); };
  $('year').addEventListener('click', () => shiftYear(-1));

  document.addEventListener('keydown', e => {
    if (document.activeElement === $('title')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); markToday(); }
    else if (e.key === 'ArrowLeft') shiftYear(-1);
    else if (e.key === 'ArrowRight') shiftYear(1);
    else if (e.key === 'e') exportData();
    else if (e.key === 'i') importData();
  });

  const title = $('title');
  title.textContent = state.title;
  title.addEventListener('click', () => { title.contentEditable = 'true'; title.focus(); getSelection().selectAllChildren(title); });
  title.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); title.blur(); } });
  title.addEventListener('blur', () => {
    title.contentEditable = 'false';
    state.title = title.textContent.trim().slice(0, 40) || 'consistency';
    title.textContent = state.title; save();
  });

  // Backup: press e / i.
  function exportData() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    a.download = `consistency-${key(today())}.json`; a.click();
  }
  function importData() {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json';
    input.onchange = async () => {
      try {
        const data = JSON.parse(await input.files[0].text());
        (data.days || []).filter(k => /^\d{4}-\d\d-\d\d$/.test(k)).forEach(k => days.add(k));
        if (data.title) title.textContent = state.title = data.title;
        save(); render();
      } catch { alert('Could not read that file.'); }
    };
    input.click();
  }

  // Stay correct across midnight and when reopened from the background.
  let lastDay = key(today());
  const tick = () => { if (key(today()) !== lastDay) { lastDay = key(today()); year = today().getFullYear(); render(); } };
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && tick());

  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
